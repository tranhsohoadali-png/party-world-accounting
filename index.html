<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DALI — Phần mềm kế toán</title>
  <!-- ?v= chống cache: MỖI LẦN deploy có sửa assets thì tăng số này (đồng bộ với script bên dưới) -->
  <link rel="stylesheet" href="assets/styles.css?v=20260912a" />
  <link rel="icon" href="assets/logo-mark.svg" />
  <!-- PWA: cài app ra màn hình chính điện thoại -->
  <link rel="manifest" href="manifest.webmanifest?v=20260912a" />
  <meta name="theme-color" content="#7cb342" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DALI Kế toán" />
  <link rel="apple-touch-icon" href="assets/icon-180.png?v=20260912a" />
  <script>
  /* Hai bản cài dùng CHUNG mã nguồn nên cũng chung manifest -> cài cả hai lên
     một điện thoại sẽ ra hai icon giống hệt, cùng tên. Đổi sang bộ nhận diện
     riêng khi đang ở tên miền của cơ sở Bóng bay. Chạy trong <head> để trình
     duyệt đọc kịp trước khi mời "Thêm vào màn hình chính". */
  (function () {
    if (!/^ktparty\./i.test(location.hostname)) return;
    var m = document.querySelector('link[rel="manifest"]');
    var h = m ? m.getAttribute('href') : '';
    var v = h.indexOf('?') >= 0 ? h.slice(h.indexOf('?')) : '';   // lay theo the manifest, khoi quen bump 2 noi
    var set = function (sel, attr, val) { var e = document.querySelector(sel); if (e) e.setAttribute(attr, val); };
    set('link[rel="manifest"]', 'href', 'manifest-ktparty.webmanifest' + v);
    set('meta[name="theme-color"]', 'content', '#e8467c');
    set('meta[name="apple-mobile-web-app-title"]', 'content', 'Bóng bay');
    set('link[rel="apple-touch-icon"]', 'href', 'assets/icon-bongbay-180.png' + v);
    document.title = 'Bóng bay Party — Kế toán';
  })();
  </script>
</head>
