  <title>DALI — Phần mềm kế toán</title>
  <!-- ?v= chống cache: MỖI LẦN deploy có sửa assets thì tăng số này (đồng bộ với script bên dưới) -->
  <link rel="stylesheet" href="assets/styles.css?v=20261010g" />
  <link rel="icon" href="assets/logo-mark.svg" />
  <!-- PWA: cài app ra màn hình chính điện thoại -->
  <link rel="manifest" href="manifest.webmanifest?v=20261010g" />
  <meta name="theme-color" content="#7cb342" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DALI Kế toán" />
  <link rel="apple-touch-icon" href="assets/icon-180.png?v=20261010g" />
  <script>
  /* Các bản cài dùng CHUNG mã nguồn nên cũng chung manifest -> cài nhiều bản lên
     một điện thoại sẽ ra mấy icon giống hệt, cùng tên. Đổi sang bộ nhận diện
     riêng theo tên miền đang mở. Chạy trong <head> để trình duyệt đọc kịp
     trước khi mời "Thêm vào màn hình chính".
     Thêm bản cài mới: thêm một dòng vào BAN_CAI (tiền tố tên miền -> nhận diện). */
  (function () {
    var BAN_CAI = [
      { ten: 'ktparty', manifest: 'manifest-ktparty.webmanifest', mau: '#e8467c',
        nhan: 'Bóng bay', icon: 'assets/icon-bongbay-180.png', tieuDe: 'Bóng bay Party — Kế toán' },
      { ten: 'kt3d',    manifest: 'manifest-kt3d.webmanifest',    mau: '#263238',
        nhan: 'In 3D',   icon: 'assets/icon-kt3d-180.png',        tieuDe: 'Xưởng in 3D — Kế toán' },
    ];
    var b = null;
    for (var i = 0; i < BAN_CAI.length; i++)
      if (new RegExp('^' + BAN_CAI[i].ten + '\\.', 'i').test(location.hostname)) { b = BAN_CAI[i]; break; }
    if (!b) return;
    var m = document.querySelector('link[rel="manifest"]');
    var h = m ? m.getAttribute('href') : '';
    var v = h.indexOf('?') >= 0 ? h.slice(h.indexOf('?')) : '';   // lay theo the manifest, khoi quen bump 2 noi
    var set = function (sel, attr, val) { var e = document.querySelector(sel); if (e) e.setAttribute(attr, val); };
    set('link[rel="manifest"]', 'href', b.manifest + v);
    set('meta[name="theme-color"]', 'content', b.mau);
    set('meta[name="apple-mobile-web-app-title"]', 'content', b.nhan);
    set('link[rel="apple-touch-icon"]', 'href', b.icon + v);
    document.title = b.tieuDe;
  })();
  </script>
</head>
